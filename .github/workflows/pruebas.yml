name: Pruebas con pytest

on:
  push:
    branches: [ main, "**" ]
  pull_request:
    branches: [ main ]

jobs:
  unitarias:
    name: Pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pytest
        run: python -m pip install --upgrade pip pytest

      - name: Ejecutar pruebas unitarias
        run: pytest -v test_precios.py

  integracion:
    name: Pruebas de integración
    needs: unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pytest
        run: python -m pip install --upgrade pip pytest

      - name: Ejecutar pruebas de integración
        run: pytest -v test_integration.py

  sistema:
    name: Pruebas de sistema
    needs: integracion
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pytest
        run: python -m pip install --upgrade pip pytest

      - name: Ejecutar pruebas de sistema
        run: pytest -v system.py
